name: Website Director framework validation

on:
  pull_request:
  push:
    branches:
      - framework-development
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-framework-validation:
    name: Core framework validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pytest and Playwright for registered suites
        run: python -m pip install --disable-pip-version-check pytest playwright

      - name: Install Chromium for synthetic clean-room proof (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          echo "Configured APT source files before CI isolation:"
          mapfile -t apt_source_files < <(
            sudo find /etc/apt -maxdepth 2 -type f \
              \( -path '/etc/apt/sources.list' -o \
                 -path '/etc/apt/sources.list.d/*.list' -o \
                 -path '/etc/apt/sources.list.d/*.sources' \) \
              -print | sort
          )
          printf ' - %s\n' "${apt_source_files[@]}"
          for source_file in "${apt_source_files[@]}"; do
            echo "--- ${source_file} ---"
            sudo sed -n '1,120p' "${source_file}"
          done

          mapfile -t google_source_files < <(
            sudo grep -RIlF \
              --include='sources.list' \
              --include='*.list' \
              --include='*.sources' \
              'dl.google.com/linux/chrome-stable/deb' \
              /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
          )
          expected_google_source='/etc/apt/sources.list.d/google-chrome.sources'
          if (( ${#google_source_files[@]} != 1 )); then
            printf 'Expected exactly one Google Chrome APT source, found %s:\n' "${#google_source_files[@]}"
            printf ' - %s\n' "${google_source_files[@]}"
            exit 1
          fi
          if [[ "${google_source_files[0]}" != "${expected_google_source}" ]]; then
            echo "Unexpected Google Chrome APT source file: ${google_source_files[0]}"
            exit 1
          fi
          if [[ -e "${expected_google_source}.disabled" ]]; then
            echo "Refusing to overwrite existing disabled source: ${expected_google_source}.disabled"
            exit 1
          fi

          echo "Disabling only Google Chrome APT source: ${expected_google_source}"
          sudo mv "${expected_google_source}" "${expected_google_source}.disabled"
          test ! -e "${expected_google_source}"
          test -f "${expected_google_source}.disabled"

          echo "Ubuntu and Microsoft APT source entries retained:"
          sudo grep -RInE \
            'azure\.archive\.ubuntu\.com|archive\.ubuntu\.com/ubuntu|security\.ubuntu\.com/ubuntu|packages\.microsoft\.com/ubuntu' \
            /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true

          python -m playwright install --with-deps chromium

      - name: Install Chromium for synthetic clean-room proof (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Run framework validator and registered suites
        run: python -m framework_validation --run-suites

      - name: Run pytest regression suite
        run: python -m pytest -q

      - name: Run framework regression suite
        run: python -m unittest tests.test_framework_validation

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-validation-${{ matrix.os }}
          path: |
            framework-validation/reports/
            framework-validation/reports/runtime/
          if-no-files-found: warn
