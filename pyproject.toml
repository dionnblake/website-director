[project]
name = "website-director-framework-validation"
description = "Deterministic self-validation contracts for the Website Director prototype"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Direct capability composites are intentional process-level entrypoints; the
# registry runs them directly. Pytest collects the standard-library unit suites
# only, while the framework registry remains the canonical full verification path.
python_files = ["test_framework_validation.py", "test_design_inspiration.py"]
addopts = "-q"
